[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info

[INPUT]
    Name          tail
    Path          /var/log/app/app.log
    Parser        json
    Tag           app.logs
    Refresh_Interval 2
    Read_from_Head true

[FILTER]
    Name          modify
    Match         app.logs
    Add           pipeline log-pipeline-mini

[OUTPUT]
    Name          opensearch
    Match         app.logs
    Host          opensearch
    Port          9200
    Index         app-logs
    Logstash_Format On
    Suppress_Type_Name On
    Generate_ID   On
