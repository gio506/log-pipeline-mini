services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      # Local dev fallback only: MUST be changed for local runs and MUST NOT be used in real environments.
      # In GitHub Actions, set OPENSEARCH_INITIAL_ADMIN_PASSWORD via repository/environment secret.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-LOCAL_DEV_ONLY_CHANGE_ME}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15

  sample-app:
    build: ./sample-app
    volumes:
      - app-logs:/var/log/app
    environment:
      - APP_NAME=orders-api
      - LOG_FILE=/var/log/app/app.log
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/app/app.log"]
      interval: 10s
      timeout: 3s
      retries: 5

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.0.7
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - app-logs:/var/log/app:ro
    depends_on:
      opensearch:
        condition: service_healthy
      sample-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep fluent-bit >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  opensearch-data:
  app-logs:
