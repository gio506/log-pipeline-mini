name: pipeline-checker

on:
  push:
    branches: ["main", "work"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${{ secrets.OPENSEARCH_INITIAL_ADMIN_PASSWORD }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Stage 1/6 - Checkout
        uses: actions/checkout@v4

      - name: Stage 2/6 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage 3/6 - Static sanity checks
        run: |
          bash -n scripts/pipeline.sh
          python -m py_compile sample-app/app.py

      - name: Stage 4/6 - Compose prerequisites + config lint
        run: |
          mkdir -p artifacts
          current=$(sysctl -n vm.max_map_count)
          echo "vm.max_map_count=${current}"
          if [ "${current}" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          docker compose version
          docker compose config > artifacts/compose.resolved.yml

      - name: Stage 5/6 - Run the 5-stage readiness pipeline
        id: run_pipeline
        run: |
          chmod +x scripts/pipeline.sh
          ./scripts/pipeline.sh

      - name: Stage 6/6 - Validate artifacts + cleanup
        if: always()
        run: |
          if [[ "${{ steps.run_pipeline.outcome }}" == "success" ]]; then
            test -s artifacts/cluster-health.json
            test -s artifacts/indexes.txt
            test -s artifacts/doc-count.json
            test -s artifacts/compose.resolved.yml
          else
            echo "Skipping artifact assertions because Stage 5 did not succeed."
            docker compose ps || true
            docker compose logs opensearch --tail=200 | tee artifacts/opensearch.failure.log || true
          fi
          docker compose down -v --remove-orphans || true

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: artifacts
          if-no-files-found: ignore
